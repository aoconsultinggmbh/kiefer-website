# ---------------------------------------------------------------------------
# Livegang: Webseite auf den echten Server hochladen (deutscher Hoster)
#
# Was passiert hier: Dieser Ablauf reagiert NUR auf den Zweig "live".
# Änderungen landen zuerst auf "main" (= Vorschau). Erst wenn jemand die
# Änderung freigibt ("main" nach "live" übernehmen), lädt GitHub die Dateien
# per verschlüsseltem FTP (FTPS) auf den echten Webserver.
# Nur Dateien, die sich geändert haben, werden übertragen.
#
# Freigabe durch Claude: "Gib die Änderungen bei Puchmayr frei" -> Claude
# übernimmt main nach live. Von Hand: Reiter "Pull requests" -> New ->
# base: live, compare: main -> Merge.
#
# Damit das läuft, müssen im Projekt drei "Secrets" hinterlegt sein
# (GitHub → Settings → Secrets and variables → Actions → New repository secret):
#
#   FTP_SERVER     z. B.  w01a2b3c.kasserver.com   (All-Inkl)  oder  www123.your-server.de (Hetzner)
#   FTP_BENUTZER   der FTP-Benutzername vom Hoster
#   FTP_PASSWORT   das dazugehörige Passwort
#   FTP_ORDNER     Zielordner auf dem Server, z. B.  /www.dental-kiefer.de/   oder  /public_html/
#
# Solange die Secrets fehlen, macht dieser Ablauf nichts und meldet das nur.
# Anleitung in leichter Sprache: doku/livegang-anleitung.md
# ---------------------------------------------------------------------------
name: Livegang (Upload zum Hoster)

on:
  push:
    branches: [live]
    paths:
      - "website/**"
      - ".github/workflows/livegang.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livegang
  cancel-in-progress: false

jobs:
  hochladen:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Pruefen, ob der Hoster schon eingerichtet ist
        id: pruefen
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::notice::Noch kein Hoster hinterlegt (Secret FTP_SERVER fehlt). Upload wird uebersprungen. Siehe doku/livegang-anleitung.md"
            echo "bereit=nein" >> "$GITHUB_OUTPUT"
          else
            echo "bereit=ja" >> "$GITHUB_OUTPUT"
          fi

      - name: Dateien holen
        if: steps.pruefen.outputs.bereit == 'ja'
        uses: actions/checkout@v4

      # Hochladen mit lftp statt mit einem fertigen Baustein.
      # Grund: Der Baustein SamKirkland/FTP-Deploy-Action bricht bei All-Inkl
      # mit "ECONNRESET (data socket)" ab. lftp kommt mit deren FTPS zurecht,
      # weil es die TLS-Sitzung der Steuerverbindung auf der Datenverbindung
      # wiederverwendet - genau das verlangt der Server.
      #
      # --delete raeumt Dateien weg, die es im Projekt nicht mehr gibt.
      # Das ist gewollt: im Zielordner liegt ausschliesslich diese Webseite.
      - name: Auf den Server hochladen (FTPS)
        if: steps.pruefen.outputs.bereit == 'ja'
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          BENUTZER: ${{ secrets.FTP_BENUTZER }}
          PASSWORT: ${{ secrets.FTP_PASSWORT }}
          ORDNER: ${{ secrets.FTP_ORDNER }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:max-retries 3
          set net:timeout 25
          set net:reconnect-interval-base 5
          set xfer:clobber on
          open "$SERVER"
          user "$BENUTZER" "$PASSWORT"
          mirror --reverse --delete --verbose --parallel=2 --exclude-glob .DS_Store --exclude-glob _alte-dateinamen/ ./website/ "$ORDNER"
          bye
          EOF
